<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Forget-Me-Note's logo and app icon. Its colors are written in here on
       purpose (no CSS variables), so no theme or dark mode can change it. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d97f8"/>
      <stop offset="1" stop-color="#4a5fd6"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.5" stop-color="#9dbcff"/>
      <stop offset="1" stop-color="#5a84f2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b2a7a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>

  <!-- The note: a white page with a folded corner and three lines. -->
  <g filter="url(#shadow)" transform="rotate(-7 236 282)">
    <path d="M120 128 a30 30 0 0 1 30 -30 h146 l78 78 v214 a30 30 0 0 1 -30 30 h-194 a30 30 0 0 1 -30 -30z" fill="#ffffff"/>
    <path d="M296 98 v50 a28 28 0 0 0 28 28 h50z" fill="#d9e2ff"/>
    <rect x="160" y="232" width="164" height="18" rx="9" fill="#dfe6fb"/>
    <rect x="160" y="282" width="176" height="18" rx="9" fill="#dfe6fb"/>
    <rect x="160" y="332" width="112" height="18" rx="9" fill="#dfe6fb"/>
  </g>

  <!-- The forget-me-not: five round blue petals, a white ring and a sunny center. -->
  <g filter="url(#shadow)" transform="translate(360 352)">
    <g stroke="#ffffff" stroke-width="9">
      <circle cx="0" cy="-58" r="50" fill="url(#petal)"/>
      <circle cx="55.2" cy="-17.9" r="50" fill="url(#petal)"/>
      <circle cx="34.1" cy="46.9" r="50" fill="url(#petal)"/>
      <circle cx="-34.1" cy="46.9" r="50" fill="url(#petal)"/>
      <circle cx="-55.2" cy="-17.9" r="50" fill="url(#petal)"/>
    </g>
    <circle r="33" fill="#ffffff"/>
    <circle r="23" fill="#ffc53d"/>
    <circle r="8" fill="#f59e0b"/>
  </g>
</svg>
